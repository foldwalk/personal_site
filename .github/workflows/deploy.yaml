name: Deploy website

# define trigger
on:
  push:
    branches:
      - main

# define tasks
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # checkout repo
      - name: Checkout
        uses: actions/checkout@v7
      
      # setup pnpm + node
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      
      # install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # build site
      - name: Build Site
        run: pnpm build
      
      # moves files to server
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Move to server
        run: |
          rsync -az --delete --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./.next ./public \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/foldwalker/releases/$(date +%Y%m%d)-$(git rev-parse --short HEAD)
