name: Deploy website

# define trigger
on:
  push:
    branches:
      - main

# define tasks
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # checkout repo
      - name: Checkout
        uses: actions/checkout@v7
      
      # setup pnpm + node
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      
      # install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # build site
      - name: Build Site
        run: pnpm build
      
      # build deployment bundle
      - name: Build deployment bundle
        run: |
          rm -rf ~/deploy
          mkdir -p ~/deploy

          cp -a .next/standalone/. ~/deploy/

          mkdir -p ~/deploy/.next
          cp -a .next/static ~/deploy/.next/

          if [ -d public ]; then
            cp -a public ~/deploy/
          fi

      # set up SSH
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # moves files to server
      - name: Move to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RELEASE=$(date +%Y%m%d)-$(git rev-parse --short HEAD)

          rsync -az --delete --mkpath \
            -e "ssh -i ~/.ssh/deploy_key" \
            ~/deploy/. \
            $DEPLOY_USER@$DEPLOY_HOST:/var/www/foldwalker.com/releases/$RELEASE/
      
      # restart server
      - name: Restart server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RELEASE=$(date +%Y%m%d)-$(git rev-parse --short HEAD)

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "sudo /usr/local/sbin/deploy-foldwalker.sh $RELEASE"
